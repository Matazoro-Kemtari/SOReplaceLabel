name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build SOReplaceLabel.sln -c Release

      - name: Prepare Release Files
        run: |
          mkdir publish
          copy SOReplaceLabel\bin\Release\net48\*.exe publish\
          copy SOReplaceLabel\bin\Release\net48\*.dll publish\
          copy SOReplaceLabel\bin\Release\net48\*.config publish\
          # NotoSansJPなどのリソースがあればコピー
          if (Test-Path "SOReplaceLabelLib\bin\Release\net48\NotoSansJP-Medium.ttf") {
            copy SOReplaceLabelLib\bin\Release\net48\NotoSansJP-Medium.ttf publish\
          }
        shell: pwsh

      - name: Create Zip
        run: |
          mkdir deploy
          powershell Compress-Archive -Path publish\* -DestinationPath deploy/SOReplaceLabel.zip
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/SOReplaceLabel.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Version File
        run: |
          # 最新バージョン情報を生成 (タグ名から 'v' を取り除いたものを設定)
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $json = @{
            latestVersion = $tag
            downloadUrl = "http://www.wadass.com/release-publisher/app-release-data/soreplacelabel-update/SOReplaceLabel.zip"
          } | ConvertTo-Json
          $json | Out-File -FilePath deploy\version.json -Encoding utf8
        shell: pwsh

      - name: Deploy to Web Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /app-release-data/soreplacelabel-update/
